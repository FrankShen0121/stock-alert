name: Taiwan Stock Alert

on:
  schedule:
    # 台灣時間週一至週五，早上 09:00 到下午 13:30，每 5 分鐘執行一次
    - cron: '*/5 1-5 * * 1-5'
  workflow_dispatch:  # 允許手動觸發測試

# 賦予 GitHub Actions 寫入倉庫的權限
permissions:
  contents: write

jobs:
  run-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas pytz requests yfinance

      - name: Run stock alert script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python stock_alert.py

      - name: Automatically commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update stock report and state [skip ci]"
          file_pattern: report.md alerted_state.json
